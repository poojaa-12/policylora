model_name: Qwen/Qwen2.5-1.5B-Instruct
adapter_name: harbor
init_adapter: artifacts/adapters/shared/v0
seed: 2210
epochs: 1
batch_size: 4
learning_rate: 0.0002
max_seq_length: 512
output_dir: artifacts/adapters/harbor/v0
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
data:
  train_path: policylora/data/generated/train.jsonl
  holdout_paths:
    - policylora/data/gold/gold.jsonl
    - policylora/data/ood/ood.jsonl
    - policylora/data/gold/tenant_eval.jsonl
  include_hard_negatives: true
  tenant_id: harbor
  mix_general: true
mlflow:
  experiment: policylora
  tracking_uri: ./mlruns
