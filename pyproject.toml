[project]
name = "policylora"
version = "0.1.0"
description = "Per-tenant LoRA enforcement loop for FINRA client communications."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "prometheus-client>=0.21",
  "pydantic>=2.6",
  "pyyaml>=6",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["pymupdf>=1.24"]
train = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "mlflow>=2.16",
  "peft>=0.13",
  "transformers>=4.45",
  "trl>=0.12",
]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
policylora-generate = "policylora.data.generate:main"
policylora-eval = "policylora.evals.harness:main"
policylora-gate = "policylora.ci.eval_gate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policylora*"]

[tool.setuptools.package-data]
policylora = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.md", "**/*.jsonl", "**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
